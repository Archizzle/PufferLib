[base]
; package = ocean
env_name = balatro
; policy_name = Policy
; rnn_name = Recurrent

[vec]
total_agents = 8192
; total_agents = 1024
; total_agents =  512
num_buffers = 4
num_threads = 12

[env]
;unsure if need to set num_agents
num_agents = 1
; reward_completed_blind = 1.0
reward_completed_blind = 0.5
reward_unused_hand = 0.15
reward_failure_penalty = -1.0
reward_illegal_action_penalty = -0.2
reward_deselect_penalty = -0.1

[train]
eps = 2.208681639623341e-10
beta1 = 0.9268802132598204
beta2 = 0.987538371286846
gamma = 0.9978947912591656
horizon = 256
vf_coef = 1.5405903111120944
ent_coef = 0.00906675491668877
anneal_lr = 1
clip_coef = 0.01
gae_lambda = 0.8053101602166689
prio_alpha = 0.8692042032389733
prio_beta0 = 0
num_workers = 2
min_lr_ratio = 0
replay_ratio = 1.967079319601145
vf_clip_coef = 2.147624388236552
learning_rate = 0.007631062421788
max_grad_norm = 2.662202525510447
vtrace_c_clip = 3.5684142417040934
minibatch_size = 8192
total_timesteps = 86812074
vtrace_rho_clip = 2.5267635273705724
seed = 42 ; previously specifieid
; Uncomment for randomizing every training run
; seed = 0 ; previously specified


[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = uniform
min = 10_000_000
max = 200_000_000
scale = 0.5

[sweep.env.reward_completed_blind]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.reward_unused_hand]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.reward_failure_penalty]
distribution = uniform
min = 0.0
max = -1.0
scale = auto

[sweep.env.reward_illegal_action_penalty]
distribution = uniform
min = 0.0
max = -1.0
scale = auto

[sweep.env.reward_deselect_penalty]
distribution = uniform
min = 0.0
max = -1.0
scale = auto

